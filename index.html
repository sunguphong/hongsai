<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HONG'S AI</title>
<meta name="description" content="Hong이 만든 AI 서비스 모음">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080f;
    --text: #f2f4fb;
    --muted: #a3a9bd;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.12);
    --accent-1: #7c8cff;
    --accent-2: #c56cff;
    --accent-3: #3fe0d0;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    overflow-x: hidden;
    word-break: keep-all;
  }

  /* 배경 빛 번짐 */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora span {
    position: absolute;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.28;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1) { top: -25vmax; left: -15vmax; background: var(--accent-1); }
  .aurora span:nth-child(2) { top: 15vh; right: -25vmax; background: var(--accent-2); animation-duration: 32s; animation-delay: -8s; }
  .aurora span:nth-child(3) { bottom: -35vmax; left: 20vw; background: var(--accent-3); opacity: 0.16; animation-duration: 38s; animation-delay: -16s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(12vw, 10vh) scale(1.2); }
  }

  .wrap {
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* 헤더 */
  header { padding: 72px 0 40px; text-align: center; }
  .logo {
    font-size: clamp(2.8rem, 9vw, 5rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, var(--accent-3), var(--accent-1) 45%, var(--accent-2) 80%, var(--accent-3));
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 9s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% center; } }
  .subtitle { margin-top: 12px; color: var(--muted); font-size: 1.05rem; }

  /* 필터 + 검색 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 28px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--muted);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .filter:hover { color: var(--text); background: var(--glass-strong); }
  .filter[aria-pressed="true"] {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(100deg, var(--accent-1), var(--accent-2));
  }

  .search { position: relative; flex: 1 1 240px; max-width: 320px; }
  .search svg {
    position: absolute;
    top: 50%;
    left: 15px;
    z-index: 1;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.25);
  }

  /* 카드 그리드 */
  main.wrap { flex: 1; padding-bottom: 64px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }

  .card {
    --c: var(--accent-1);
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 26px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background:
      radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--c) 20%, transparent), transparent 60%),
      var(--glass);
    color: inherit;
    text-decoration: none;
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
    animation-delay: calc(var(--i) * 90ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover,
  .card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--c);
    box-shadow:
      0 14px 40px color-mix(in srgb, var(--c) 28%, transparent),
      0 0 0 1px var(--c),
      0 0 26px color-mix(in srgb, var(--c) 45%, transparent);
    outline: none;
  }

  .icon {
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    margin-bottom: 18px;
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    border-radius: 16px;
    background: color-mix(in srgb, var(--c) 18%, transparent);
    font-size: 2.1rem;
    line-height: 1;
  }
  .name { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
  .desc { flex: 1; margin-top: 8px; color: var(--muted); font-size: 0.92rem; line-height: 1.6; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
  }
  .tag {
    padding: 4px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: color-mix(in srgb, var(--c) 72%, white);
    font-size: 0.78rem;
    font-weight: 500;
  }
  .cta { color: color-mix(in srgb, var(--c) 72%, white); font-size: 0.9rem; font-weight: 700; }
  .cta i { display: inline-block; font-style: normal; transition: transform 0.25s ease; }
  .card:hover .cta i,
  .card:focus-visible .cta i { transform: translateX(4px); }

  .empty { padding: 64px 0; color: var(--muted); text-align: center; }

  footer {
    padding: 24px 0 32px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }

  /* 비밀번호 화면 */
  body.locked > :not(.aurora, .gate) { display: none; }
  body:not(.locked) .gate { display: none; }
  .gate {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
  }
  .gate form {
    width: 100%;
    max-width: 360px;
    margin-top: 32px;
    padding: 28px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .gate form.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  .gate label { display: block; margin-bottom: 12px; font-weight: 500; }
  .gate input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--glass);
    color: var(--text);
    font: inherit;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-align: center;
  }
  .gate input:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.25);
  }
  .gate button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(100deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .gate-error { min-height: 1.5em; margin-top: 12px; color: #fb7185; font-size: 0.88rem; }

  /* 태블릿 2열 */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* 모바일 1열 */
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header { padding: 48px 0 28px; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .search { flex-basis: 100%; max-width: none; }
    .card { padding: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora span, .logo, .card, .gate form.shake { animation: none; }
    .card, .cta i { transition: none; }
  }
</style>
</head>
<body class="locked">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <section class="gate">
    <p class="logo">HONG'S AI</p>
    <form id="gate-form">
      <label for="gate-input">비밀번호를 입력하세요</label>
      <input id="gate-input" type="password" inputmode="numeric" autocomplete="off" autofocus>
      <button type="submit">입장</button>
      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
  </section>

  <div class="wrap">
    <header>
      <h1 class="logo">HONG'S AI</h1>
      <p class="subtitle">Hong이 만든 AI 서비스 모음</p>
    </header>
  </div>

  <main class="wrap">
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="카테고리 필터"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="서비스 검색" aria-label="서비스 검색" autocomplete="off">
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" role="status" hidden>검색 결과가 없습니다.</p>
  </main>

  <footer>© 2026 HONG'S AI</footer>

<script>
  // ▼ 새 사이트는 여기에 한 줄만 추가하면 카드가 자동으로 생깁니다.
  const sites = [
    { name: "동탄역포레너스 매물추적기", url: "https://forenus.github.io/real/#dashboard", description: "동탄역 포레너스 단지 매물 현황을 추적하는 대시보드", icon: "🏢", category: "부동산", color: "#4f9dff" },
    { name: "열림시스템 주간보고", url: "https://35-239-228-66.sslip.io/", description: "팀 주간보고 작성·관리 시스템", icon: "📊", category: "업무", color: "#a78bfa" },
    { name: "다양한정보 수집 Agent", url: "https://sunguphong.github.io/sapinfoagent/", description: "여러 출처의 정보를 자동으로 수집·정리하는 AI 에이전트", icon: "🤖", category: "정보수집", color: "#2dd4bf" },
    { name: "업이의 꽌시노트", url: "https://sunguphong.github.io/relation/", description: "인맥과 관계를 기록하고 관리하는 노트", icon: "🤝", category: "생활", color: "#fb7185" },
    { name: "우리집 건강돌봄이", url: "https://sunguphong.github.io/family-health/", description: "가족 구성원의 건강 기록을 관리하는 앱", icon: "💊", category: "생활", color: "#4ade80" },
    { name: "안전보건 입찰 평가표 시뮬레이션", url: "https://sunguphong.github.io/safety/", description: "안전보건 분야 입찰 평가 점수를 미리 계산해보는 시뮬레이터", icon: "🦺", category: "업무", color: "#fbbf24" },
    { name: "SAP ABAP 30일×2 완성", url: "https://sunguphong.github.io/edusap/", description: "하루 30분씩 SAP ABAP을 익히는 교육과정", icon: "📘", category: "교육", color: "#38bdf8" },
    { name: "우리집 관리비", url: "https://sunguphong.github.io/apt-bill/#/", description: "아파트 관리비 내역을 기록하고 관리하는 앱", icon: "🧾", category: "생활", color: "#f97316" },
    { name: "The Daily Fit", url: "https://sunguphong.github.io/daily-fit/", description: "날씨와 일정에 맞춰 오늘의 코디를 추천하고 착장을 평가하는 AI 스타일 저널", icon: "👔", category: "생활", color: "#e879f9" },
  ];

  // 필터 버튼 순서. sites에 새 카테고리를 쓰면 버튼이 뒤에 자동으로 추가됩니다.
  const ALL = "전체";
  const categories = [...new Set([ALL, "부동산", "업무", "생활", "정보수집", ...sites.map(s => s.category)])];

  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const search = document.getElementById("search");
  const empty = document.getElementById("empty");
  let activeCategory = ALL;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createCard(site, index) {
    const card = el("a", "card");
    card.href = site.url;
    card.target = "_blank";
    card.rel = "noopener";
    card.style.setProperty("--c", site.color);
    card.style.setProperty("--i", index);

    const icon = el("div", "icon", site.icon);
    icon.setAttribute("aria-hidden", "true");

    const meta = el("div", "meta");
    const cta = el("span", "cta", "바로가기 ");
    cta.append(el("i", "", "→"));
    meta.append(el("span", "tag", site.category), cta);

    card.append(icon, el("h2", "name", site.name), el("p", "desc", site.description), meta);
    return card;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const visible = sites.filter(site => {
      const inCategory = activeCategory === ALL || site.category === activeCategory;
      const text = `${site.name} ${site.description} ${site.category}`.toLowerCase();
      return inCategory && text.includes(query);
    });
    grid.replaceChildren(...visible.map(createCard));
    empty.hidden = visible.length > 0;
  }

  categories.forEach(category => {
    const button = el("button", "filter", category);
    button.type = "button";
    button.setAttribute("aria-pressed", String(category === activeCategory));
    button.addEventListener("click", () => {
      activeCategory = category;
      filters.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
      render();
    });
    filters.append(button);
  });

  search.addEventListener("input", render);

  // 비밀번호 화면. 비밀번호를 바꾸려면 새 비밀번호의 SHA-256 값으로 교체합니다.
  const PASSWORD_HASH = "f40ddf6742b7761b0f7df1f65a639c4fccc23479c5c4c984885ff588f1dfeb0e";
  const UNLOCK_KEY = "hongsai-unlocked";
  const gateForm = document.getElementById("gate-form");
  const gateInput = document.getElementById("gate-input");
  const gateError = document.getElementById("gate-error");

  async function sha256(text) {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function isRemembered() {
    try { return sessionStorage.getItem(UNLOCK_KEY) === PASSWORD_HASH; } catch { return false; }
  }

  function unlock() {
    document.body.classList.remove("locked");
    render();
  }

  gateForm.addEventListener("submit", async event => {
    event.preventDefault();
    const hash = await sha256(gateInput.value);
    if (hash === PASSWORD_HASH) {
      try { sessionStorage.setItem(UNLOCK_KEY, hash); } catch {}
      unlock();
      return;
    }
    gateError.textContent = "비밀번호가 올바르지 않습니다.";
    gateInput.value = "";
    gateInput.focus();
    gateForm.classList.remove("shake");
    void gateForm.offsetWidth;
    gateForm.classList.add("shake");
  });

  if (isRemembered()) unlock();
</script>
</body>
</html>
