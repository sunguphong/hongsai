<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HONG'S AI</title>
<meta name="description" content="Hong이 만든 AI 서비스 모음">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080f;
    --text: #f2f4fb;
    --muted: #a3a9bd;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.12);
    --accent-1: #7c8cff;
    --accent-2: #c56cff;
    --accent-3: #3fe0d0;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    overflow-x: hidden;
    word-break: keep-all;
  }

  /* 배경 빛 번짐 */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora span {
    position: absolute;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.28;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1) { top: -25vmax; left: -15vmax; background: var(--accent-1); }
  .aurora span:nth-child(2) { top: 15vh; right: -25vmax; background: var(--accent-2); animation-duration: 32s; animation-delay: -8s; }
  .aurora span:nth-child(3) { bottom: -35vmax; left: 20vw; background: var(--accent-3); opacity: 0.16; animation-duration: 38s; animation-delay: -16s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(12vw, 10vh) scale(1.2); }
  }

  .wrap {
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* 헤더 */
  header { padding: 72px 0 40px; text-align: center; }
  .logo {
    font-size: clamp(2.8rem, 9vw, 5rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, var(--accent-3), var(--accent-1) 45%, var(--accent-2) 80%, var(--accent-3));
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 9s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% center; } }
  .subtitle { margin-top: 12px; color: var(--muted); font-size: 1.05rem; }

  /* 필터 + 검색 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 28px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--muted);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .filter:hover { color: var(--text); background: var(--glass-strong); }
  .filter[aria-pressed="true"] {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(100deg, var(--accent-1), var(--accent-2));
  }

  .search { position: relative; flex: 1 1 240px; max-width: 320px; }
  .search svg {
    position: absolute;
    top: 50%;
    left: 15px;
    z-index: 1;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.25);
  }

  /* 카드 그리드 */
  main.wrap { flex: 1; padding-bottom: 64px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }

  .card {
    --c: var(--accent-1);
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 26px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background:
      radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--c) 20%, transparent), transparent 60%),
      var(--glass);
    color: inherit;
    text-decoration: none;
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
    animation-delay: calc(var(--i) * 90ms);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover,
  .card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--c);
    box-shadow:
      0 14px 40px color-mix(in srgb, var(--c) 28%, transparent),
      0 0 0 1px var(--c),
      0 0 26px color-mix(in srgb, var(--c) 45%, transparent);
    outline: none;
  }

  .icon {
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    margin-bottom: 18px;
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    border-radius: 16px;
    background: color-mix(in srgb, var(--c) 18%, transparent);
    font-size: 2.1rem;
    line-height: 1;
  }
  .name { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
  .desc { flex: 1; margin-top: 8px; color: var(--muted); font-size: 0.92rem; line-height: 1.6; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
  }
  .tag {
    padding: 4px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: color-mix(in srgb, var(--c) 72%, white);
    font-size: 0.78rem;
    font-weight: 500;
  }
  .cta { color: color-mix(in srgb, var(--c) 72%, white); font-size: 0.9rem; font-weight: 700; }
  .cta i { display: inline-block; font-style: normal; transition: transform 0.25s ease; }
  .card:hover .cta i,
  .card:focus-visible .cta i { transform: translateX(4px); }

  .empty { padding: 64px 0; color: var(--muted); text-align: center; }

  footer {
    padding: 24px 0 32px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }

  /* 비밀번호 화면 */
  body.locked > :not(.aurora, .gate) { display: none; }
  body:not(.locked) .gate { display: none; }
  .gate {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
  }
  .gate form {
    width: 100%;
    max-width: 360px;
    margin-top: 32px;
    padding: 28px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .gate form.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  .gate label { display: block; margin-bottom: 12px; font-weight: 500; }
  .gate input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--glass);
    color: var(--text);
    font: inherit;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-align: center;
  }
  .gate input[type="password"]:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.25);
  }
  .gate button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(100deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .gate-options {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .gate-options label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-weight: 400;
    cursor: pointer;
  }
  .gate-options input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-1); cursor: pointer; }
  .logout {
    margin-left: 10px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .logout:hover { color: var(--text); }
  .gate-error { min-height: 1.5em; margin-top: 12px; color: #fb7185; font-size: 0.88rem; }

  /* 관리자 메뉴 */
  header { position: relative; }
  .admin-toggle {
    position: absolute;
    top: 24px;
    right: 0;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: color 0.2s, background 0.2s;
  }
  .admin-toggle:hover { color: var(--text); background: var(--glass-strong); }

  body:not(.admin-mode) .admin { display: none; }
  body.admin-mode .toolbar,
  body.admin-mode #grid,
  body.admin-mode #empty { display: none !important; }

  .admin-head { margin-bottom: 24px; }
  .admin-head h2 { font-size: 1.5rem; font-weight: 700; }
  .admin-head p { max-width: 720px; margin-top: 8px; color: var(--muted); font-size: 0.92rem; line-height: 1.6; }

  .panel {
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .flow {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 36px;
    margin-bottom: 24px;
    padding: 24px;
  }
  .flow-col { position: relative; }
  .flow-col + .flow-col::before {
    content: "→";
    position: absolute;
    top: 0;
    left: -26px;
    color: var(--muted);
    font-size: 1.1rem;
  }
  .flow-col h3 { font-size: 0.95rem; font-weight: 700; }
  .flow-col h3 small { display: block; margin-top: 2px; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
  .flow-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

  .chip {
    --layer: #8a90a6;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border: 1px solid color-mix(in srgb, var(--layer) 35%, transparent);
    border-radius: 10px;
    background: color-mix(in srgb, var(--layer) 12%, transparent);
    color: color-mix(in srgb, var(--layer) 70%, white);
    font: inherit;
    font-size: 0.82rem;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .chip:hover { background: color-mix(in srgb, var(--layer) 24%, transparent); }
  .chip.on { border-color: var(--layer); background: var(--layer); color: #0b0c14; }
  .flow .chip { width: 100%; }
  .chip .count {
    margin-left: auto;
    padding: 0 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--layer) 25%, transparent);
    font-size: 0.75rem;
  }
  .layer-hosting { --layer: #7c8cff; }
  .layer-server  { --layer: #fbbf24; }
  .layer-storage { --layer: #4ade80; }
  .layer-api     { --layer: #e879f9; }
  .chip.unknown  { --layer: #8a90a6; }

  .infra-table { padding: 4px 24px; }
  .infra-row {
    display: grid;
    grid-template-columns: 1.3fr repeat(4, minmax(0, 1fr));
    gap: 16px;
    padding: 18px 0;
    border-top: 1px solid var(--line);
    transition: opacity 0.2s;
  }
  .infra-row:first-child { border-top: 0; }
  .infra-row.head { padding: 14px 0; color: var(--muted); font-size: 0.8rem; }
  .infra-row.dim { opacity: 0.25; }
  .cell { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
  .svc-name { font-size: 0.95rem; font-weight: 700; line-height: 1.4; }
  .svc-note { margin-top: 6px; color: var(--muted); font-size: 0.8rem; line-height: 1.55; }
  .none { color: var(--muted); font-size: 0.82rem; }
  .admin-note { margin-top: 16px; color: var(--muted); font-size: 0.8rem; line-height: 1.6; }

  @media (max-width: 1024px) {
    .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .flow-col + .flow-col::before { display: none; }
    .infra-row.head { display: none; }
    .infra-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .cell::before { content: attr(data-label); width: 100%; color: var(--muted); font-size: 0.75rem; }
  }
  @media (max-width: 640px) {
    .admin-toggle { top: 10px; }
    .flow { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 20px; }
    .infra-table { padding: 4px 20px; }
  }

  /* 태블릿 2열 */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* 모바일 1열 */
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header { padding: 48px 0 28px; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .search { flex-basis: 100%; max-width: none; }
    .card { padding: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora span, .logo, .card, .gate form.shake { animation: none; }
    .card, .cta i { transition: none; }
  }
</style>
</head>

    { name: "SAP 개발팀 개발 관리 보드", url: "https://contributions-rec-wiring-sign.trycloudflare.com/login", description: "SAP 개발팀의 개발 진행 현황을 관리하는 보드", icon: "🧑‍💻", category: "업무", color: "#22d3ee" },
  ];

  // 필터 버튼 순서. sites에 새 카테고리를 쓰면 버튼이 뒤에 자동으로 추가됩니다.
  const ALL = "전체";
  const categories = [...new Set([ALL, "부동산", "업무", "생활", "정보수집", ...sites.map(s => s.category)])];

  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const search = document.getElementById("search");
  const empty = document.getElementById("empty");
  let activeCategory = ALL;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createCard(site, index) {
    const card = el("a", "card");
    card.href = site.url;
    card.target = "_blank";
    card.rel = "noopener";
    card.style.setProperty("--c", site.color);
    card.style.setProperty("--i", index);

    const icon = el("div", "icon", site.icon);
    icon.setAttribute("aria-hidden", "true");

    const meta = el("div", "meta");
    const cta = el("span", "cta", "바로가기 ");
    cta.append(el("i", "", "→"));
    meta.append(el("span", "tag", site.category), cta);

    card.append(icon, el("h2", "name", site.name), el("p", "desc", site.description), meta);
    return card;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const visible = sites.filter(site => {
      const inCategory = activeCategory === ALL || site.category === activeCategory;
      const text = `${site.name} ${site.description} ${site.category}`.toLowerCase();
      return inCategory && text.includes(query);
    });
    grid.replaceChildren(...visible.map(createCard));
    empty.hidden = visible.length > 0;
  }

  categories.forEach(category => {
    const button = el("button", "filter", category);
    button.type = "button";
    button.setAttribute("aria-pressed", String(category === activeCategory));
    button.addEventListener("click", () => {
      activeCategory = category;
      filters.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
      render();
    });
    filters.append(button);
  });

  search.addEventListener("input", render);

  // ▼ 관리자 메뉴: 서비스별 인프라 구성. 키는 sites의 name과 같아야 합니다.
  //   hosting(어디에 올렸나) / server(무엇이 돌아가나) / storage(어디에 저장하나) / api(AI·외부 기능)
  const UNKNOWN = "미확인";
  const infra = {
    "HONG'S AI": {
      hosting: ["GitHub Pages"], server: ["없음 (정적 페이지)"],
      storage: ["브라우저 localStorage", "브라우저 sessionStorage"], api: ["Google Fonts"],
      note: "단일 index.html. 자동 로그인·비밀번호 저장 정보만 브라우저에 보관",
    },
    "동탄역포레너스 매물추적기": {
      hosting: ["GitHub Pages"], server: ["PC Node.js 서버", "Cloudflare Tunnel"],
      storage: ["PC 로컬 파일 (JSON)", "GitHub 저장소 (Git)"], api: ["네이버 부동산", "국토부 실거래가", "호갱노노"],
      note: "PC 서버가 30분마다 수집해 history.json에 쌓고, 공개용 요약(docs/data.json)을 GitHub에 올림. 공개 페이지의 수동 수집은 터널을 거쳐 PC 서버에 요청",
    },
    "열림시스템 주간보고": {
      hosting: ["Google Cloud VM (추정)"], server: [UNKNOWN], storage: [UNKNOWN], api: [UNKNOWN],
      note: "저장소 코드가 없어 접속 주소(35.239.228.66 · sslip.io)로만 추정",
    },
    "다양한정보 수집 Agent": {
      hosting: ["GitHub Pages"], server: ["GitHub Actions (예약 실행)", "Windows 작업 스케줄러", "PC Node.js 서버", "ngrok"],
      storage: ["GitHub 저장소 (Git)", "PC 로컬 파일 (JSON)"], api: ["RSS 뉴스", "Claude Code CLI", "Gmail SMTP"],
      note: "매일 아침 RSS 수집 → Claude 요약 → 메일 발송. 실행 기록은 ci-state 브랜치에 저장. GitHub Pages는 안내 페이지, 관리 웹은 PC에서 실행",
    },
    "업이의 꽌시노트": {
      hosting: ["GitHub Pages"], server: ["Google Apps Script"],
      storage: ["브라우저 localStorage", "Google 스프레드시트"], api: [],
      note: "구글 시트에는 비밀번호로 암호화한 데이터만 동기화",
    },
    "우리집 건강돌봄이": {
      hosting: ["GitHub Pages"], server: ["Supabase"],
      storage: ["브라우저 IndexedDB", "Supabase (PostgreSQL)"], api: ["Claude API", "Tesseract.js OCR", "pdf.js"],
      note: "React + Vite 빌드 후 gh-pages 브랜치로 배포. 로그인 계정은 Supabase 관리자만 생성. AI 추출은 선택 기능",
    },
    "안전보건 입찰 평가표 시뮬레이션": {
      hosting: ["GitHub Pages"], server: ["PC Node.js 서버", "Cloudflare Tunnel", "ngrok"],
      storage: ["브라우저 localStorage"], api: ["Tesseract.js OCR"],
      note: "기본은 서버 없이 동작. 여러 명이 함께 편집할 때만 PC 서버를 터널로 공개",
    },
    "SAP ABAP 30일×2 완성": {
      hosting: ["GitHub Pages"], server: ["없음 (정적 페이지)"],
      storage: ["브라우저 localStorage"], api: ["Claude API"],
      note: "HTML·CSS·JS 정적 사이트. 질문 기능은 본인 Anthropic API 키 사용",
    },
    "우리집 관리비": {
      hosting: ["GitHub Pages"], server: ["Cloudflare Worker"],
      storage: ["브라우저 IndexedDB"], api: ["Claude API"],
      note: "고지서 캡처를 Claude가 분석. API 키를 숨기는 Cloudflare Worker 프록시 사용",
    },
    "The Daily Fit": {
      hosting: ["GitHub Pages"], server: ["없음 (정적 페이지)"],
      storage: ["브라우저 localStorage", "브라우저 IndexedDB"], api: ["Claude API", "Gemini API", "Open-Meteo 날씨", "MediaPipe"],
      note: "단일 HTML. API 키는 각 기기 브라우저에만 저장. 얼굴 블러는 기기 안에서 처리",
    },
    "SAP 개발팀 개발 관리 보드": {
      hosting: ["자체 서버 (추정)"], server: ["Cloudflare Tunnel"], storage: [UNKNOWN], api: [UNKNOWN],
      note: "trycloudflare.com 임시 터널 주소. 터널을 다시 켜면 주소가 바뀜",
    },
  };

  const LAYERS = [
    { key: "hosting", title: "호스팅", desc: "어디에 올렸나" },
    { key: "server", title: "서버·자동화", desc: "무엇이 돌아가나" },
    { key: "storage", title: "데이터 저장", desc: "어디에 저장하나" },
    { key: "api", title: "AI·외부 기능", desc: "무엇을 쓰나" },
  ];
  const flow = document.getElementById("flow");
  const infraTable = document.getElementById("infra-table");
  const adminToggle = document.getElementById("admin-toggle");
  let activeChip = null;

  function infraRows() {
    const missing = { hosting: [UNKNOWN], server: [UNKNOWN], storage: [UNKNOWN], api: [UNKNOWN], note: "인프라 정보가 아직 등록되지 않았습니다." };
    return [
      { name: "HONG'S AI (이 포털)", icon: "✨", ...infra["HONG'S AI"] },
      ...sites.map(site => ({ name: site.name, icon: site.icon, ...(infra[site.name] || missing) })),
    ];
  }

  function chip(layer, label, count) {
    const key = `${layer}|${label}`;
    const button = el("button", `chip layer-${layer}` + (label === UNKNOWN ? " unknown" : ""), label);
    button.type = "button";
    button.setAttribute("aria-pressed", String(activeChip === key));
    if (activeChip === key) button.classList.add("on");
    if (count !== undefined) button.append(el("span", "count", String(count)));
    button.addEventListener("click", () => {
      activeChip = activeChip === key ? null : key;
      renderAdmin();
    });
    return button;
  }

  function renderAdmin() {
    const rows = infraRows();

    flow.replaceChildren(...LAYERS.map((layer, i) => {
      const counts = new Map();
      rows.forEach(row => (row[layer.key] || []).forEach(item => counts.set(item, (counts.get(item) || 0) + 1)));
      const sorted = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));
      const col = el("div", "flow-col");
      const title = el("h3", "", `${i + 1}. ${layer.title}`);
      title.append(el("small", "", layer.desc));
      const list = el("div", "flow-list");
      list.append(...sorted.map(([label, count]) => chip(layer.key, label, count)));
      col.append(title, list);
      return col;
    }));

    const head = el("div", "infra-row head");
    head.append(el("div", "", "서비스"), ...LAYERS.map(layer => el("div", "", layer.title)));
    infraTable.replaceChildren(head, ...rows.map(row => {
      const line = el("div", "infra-row");
      if (activeChip) {
        const [layer, label] = activeChip.split("|");
        if (!(row[layer] || []).includes(label)) line.classList.add("dim");
      }
      const nameCell = el("div");
      nameCell.append(el("div", "svc-name", `${row.icon} ${row.name}`), el("div", "svc-note", row.note || ""));
      line.append(nameCell, ...LAYERS.map(layer => {
        const cell = el("div", "cell");
        cell.dataset.label = layer.title;
        const items = row[layer.key] || [];
        if (items.length) cell.append(...items.map(item => chip(layer.key, item)));
        else cell.append(el("span", "none", "—"));
        return cell;
      }));
      return line;
    }));
  }

  function setAdmin(on) {
    document.body.classList.toggle("admin-mode", on);
    adminToggle.textContent = on ? "← 서비스 목록" : "⚙ 관리자";
    adminToggle.setAttribute("aria-pressed", String(on));
    if (on) renderAdmin();
  }

  adminToggle.addEventListener("click", () => setAdmin(!document.body.classList.contains("admin-mode")));

  // 비밀번호 화면. 비밀번호를 바꾸려면 새 비밀번호의 SHA-256 값으로 교체합니다.
  const PASSWORD_HASH = "f40ddf6742b7761b0f7df1f65a639c4fccc23479c5c4c984885ff588f1dfeb0e";
  const UNLOCK_KEY = "hongsai-unlocked";          // 같은 탭 유지 (sessionStorage)
  const SAVED_PASSWORD_KEY = "hongsai-saved-password"; // 비밀번호 저장 (localStorage)
  const AUTO_LOGIN_KEY = "hongsai-auto-login";     // 자동 로그인 (localStorage)
  const gateForm = document.getElementById("gate-form");
  const gateInput = document.getElementById("gate-input");
  const gateError = document.getElementById("gate-error");
  const savePassword = document.getElementById("save-password");
  const autoLogin = document.getElementById("auto-login");

  // 브라우저 저장소 접근이 막혀 있어도(사생활 보호 모드 등) 페이지가 동작하도록 감쌈
  const store = {
    get(area, key) { try { return window[area].getItem(key); } catch { return null; } },
    set(area, key, value) { try { window[area].setItem(key, value); } catch {} },
    remove(area, key) { try { window[area].removeItem(key); } catch {} },
  };

  function fillSavedPassword() {
    const saved = store.get("localStorage", SAVED_PASSWORD_KEY);
    gateInput.value = saved || "";
    savePassword.checked = saved !== null;
    autoLogin.checked = false;
  }

  document.getElementById("logout").addEventListener("click", () => {
    store.remove("sessionStorage", UNLOCK_KEY);
    store.remove("localStorage", AUTO_LOGIN_KEY);
    fillSavedPassword();
    gateError.textContent = "";
    document.body.classList.add("locked");
    setAdmin(false);
    gateInput.focus();
  });

  async function sha256(text) {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function isRemembered() {
    return store.get("sessionStorage", UNLOCK_KEY) === PASSWORD_HASH
      || store.get("localStorage", AUTO_LOGIN_KEY) === PASSWORD_HASH;
  }

  function unlock() {
    document.body.classList.remove("locked");
    render();
  }

  gateForm.addEventListener("submit", async event => {
    event.preventDefault();
    const hash = await sha256(gateInput.value);
    if (hash === PASSWORD_HASH) {
      store.set("sessionStorage", UNLOCK_KEY, hash);
      if (savePassword.checked) store.set("localStorage", SAVED_PASSWORD_KEY, gateInput.value);
      else store.remove("localStorage", SAVED_PASSWORD_KEY);
      if (autoLogin.checked) store.set("localStorage", AUTO_LOGIN_KEY, hash);
      else store.remove("localStorage", AUTO_LOGIN_KEY);
      unlock();
      return;
    }
    gateError.textContent = "비밀번호가 올바르지 않습니다.";
    gateInput.value = "";
    gateInput.focus();
    gateForm.classList.remove("shake");
    void gateForm.offsetWidth;
    gateForm.classList.add("shake");
  });

  fillSavedPassword();
  if (isRemembered()) unlock();
</script>
